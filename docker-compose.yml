version: '3.8'

services:
  work-service:
    build: .
    ports:
      - "8082:8082"
      - "8083:8083"
    environment:
      - GRPC_PORT=8082
      - HTTP_PORT=8083
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8083/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  log-collector:
    image: alpine:latest
    command: ["/bin/sh", "-c", "while true; do sleep 5; done"]
    stdin_open: true
    tty: true
    volumes:
      - ./logs:/logs
    depends_on:
      - work-service

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - work-service

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - work-service

volumes:
  grafana-data: