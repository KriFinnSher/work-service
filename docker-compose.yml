version: '3.8'

services:
  work-service:
    build: .
    ports:
      - "8082:8082"
      - "8083:8083"
    environment:
      - GRPC_PORT=8082
      - HTTP_PORT=8083
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8083/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  log-collector:
    image: alpine:latest
    command: ["/bin/sh", "-c", "while true; do sleep 5; done"]
    stdin_open: true
    tty: true
    volumes:
      - ./logs:/logs
    depends_on:
      - work-service