name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment"
        required: true
        type: choice
        options: [dev, staging, prod]
      strategy:
        description: "Deploy strategy"
        required: true
        type: choice
        options: [rolling, recreate, canary]
      ref_type:
        description: "branch or tag"
        required: true
        type: choice
        options: [branch, tag]
      ref_name:
        description: "Branch name or tag"
        required: true
        type: string
      release_id:
        description: "MAMS release id"
        required: true
        type: string
      mams_callback_url:
        description: "MAMS callback URL (optional)"
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Simulate deploy
        run: |
          echo "Deploying to ${{ inputs.environment }}..."
          echo "Strategy: ${{ inputs.strategy }}"
          echo "Ref: ${{ inputs.ref_type }}/${{ inputs.ref_name }}"
          echo "Release ID: ${{ inputs.release_id }}"
          sleep 5
          echo "Deploy completed successfully!"

      - name: Callback to MAMS (optional)
        if: inputs.mams_callback_url != ''
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          CALLBACK_URL: ${{ inputs.mams_callback_url }}
        run: |
          curl -sS -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"release_id\":\"$RELEASE_ID\",\"status\":\"success\"}" || echo "Callback failed, ignoring..."