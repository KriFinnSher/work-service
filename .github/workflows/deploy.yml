name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment"
        required: true
        type: choice
        options: [dev, staging, prod]
      strategy:
        description: "Deploy strategy"
        required: true
        type: choice
        options: [rolling, recreate, canary]
      ref_type:
        description: "branch or tag"
        required: true
        type: choice
        options: [branch, tag]
      ref_name:
        description: "Branch name or tag"
        required: true
        type: string
      release_id:
        description: "MAMS release id"
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: docker.io/vaverinov/work-service:${{ inputs.ref_name }}
          cache-from: type=registry,ref=docker.io/vaverinov/work-service:latest
          cache-to: type=inline

      - name: Simulate deployment
        run: |
          echo "Image pushed: docker.io/vaverinov/work-service:${{ inputs.ref_name }}"
          echo "Deploying to ${{ inputs.environment }} with strategy ${{ inputs.strategy }}"
          sleep 3
          echo "Deployment completed!"