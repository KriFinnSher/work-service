name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment"
        required: true
        type: choice
        options: [dev, staging, prod]
      strategy:
        description: "Deploy strategy"
        required: true
        type: choice
        options: [rolling, recreate, canary]
      ref_type:
        description: "branch or tag"
        required: true
        type: choice
        options: [branch, tag]
      ref_name:
        description: "Branch name or tag"
        required: true
        type: string
      release_id:
        description: "MAMS release id"
        required: true
        type: string
      mams_callback_url:
        description: "MAMS callback URL (optional)"
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ inputs.ref_name }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:latest
          cache-to: type=inline

      - name: Simulate deployment
        run: |
          echo "Image pushed: ghcr.io/${{ github.repository }}:${{ github.sha }}"
          echo "Deploying to ${{ inputs.environment }} with strategy ${{ inputs.strategy }}"
          echo "In production, this would trigger kubectl rollout or docker-compose pull & up"
          sleep 3
          echo "Deployment completed!"

      - name: Callback to MAMS (optional)
        if: inputs.mams_callback_url != ''
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          CALLBACK_URL: ${{ inputs.mams_callback_url }}
        run: |
          curl -sS -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"release_id\":\"$RELEASE_ID\",\"status\":\"success\"}" || echo "Callback failed, ignoring..."